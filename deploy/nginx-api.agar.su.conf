map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.agar.su;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.agar.su;

    ssl_certificate     /etc/letsencrypt/live/api.agar.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agar.su/privkey.pem;
    client_max_body_size 50m;

    root /root/client/public;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;

    location ~* ^/(skinlist|stickerlist|pass|invisible|rotation|word|allowtxt)\.txt$ {
        expires -1;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /skins/ {
        expires 7d;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ^~ /stickers/ {
        expires 7d;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
