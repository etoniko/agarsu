<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Agar.su</title>
  <link id="pageIcon" rel="icon" type="image/png" href="https://agar.su/skins/4.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg0: #0a0d14;
      --bg1: #121722;
      --panel: rgba(22, 28, 42, 0.88);
      --panel2: rgba(30, 38, 56, 0.95);
      --text: #eef2fb;
      --muted: #939cb3;
      --accent: #4f8cff;
      --accent2: #36d6b2;
      --border: rgba(120, 140, 180, 0.18);
      --gold: #ffd54f;
      --danger: #ff5c7a;
      --danger-bg: rgba(255, 92, 122, 0.12);
      --ok: #6fe3a1;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(79, 140, 255, 0.22), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(54, 214, 178, 0.12), transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      background-attachment: fixed;
    }
    body.has-stats-bg {
      background:
        linear-gradient(180deg, rgba(10, 13, 20, 0.62), rgba(10, 13, 20, 0.82)),
        var(--stats-bg-image) center / cover no-repeat fixed;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 64px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a.back {
      color: var(--muted); text-decoration: none; font-size: 0.92rem;
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px;
    }
    a.back:hover { color: var(--text); }
    .hero {
      position: relative; overflow: hidden;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px); box-shadow: var(--shadow);
      padding: 22px; margin-bottom: 18px;
      backdrop-filter: blur(10px);
    }
    .hero::before {
      content: ""; position: absolute; inset: -40% auto auto -20%;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(79,140,255,.25), transparent 70%);
      pointer-events: none;
    }
    .profile-head {
      position: relative; z-index: 1;
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    }
    .avatar {
      width: 84px; height: 84px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.12);
      object-fit: cover; flex-shrink: 0; background: var(--panel2);
      background-size: cover; background-position: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .profile-nick {
      font-size: clamp(1.35rem, 3vw, 1.85rem); font-weight: 800; letter-spacing: -0.02em;
    }
    .profile-nick.rank-gold { color: var(--gold); }
    .profile-nick.rank-silver { color: #c9c8c4; }
    .profile-nick.rank-bronze { color: #d0893d; }
    .profile-nick-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .profile-meta { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }
    .profile-trophy { display: inline-flex; width: 26px; height: 26px; flex-shrink: 0; }
    .profile-trophy img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .profile-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      color: var(--text); cursor: pointer; font-size: 0.9rem; font-weight: 600;
      font-family: inherit; transition: .15s ease;
    }
    .btn:hover { border-color: rgba(79,140,255,.55); transform: translateY(-1px); }
    .btn.ok { border-color: rgba(111,227,161,.55); color: var(--ok); }
    .ban-banner {
      position: relative; z-index: 1; margin-top: 16px;
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px 16px; border-radius: 14px;
      background: var(--danger-bg); border: 1px solid rgba(255,92,122,.4);
      color: #ffd0d9;
    }
    .ban-banner strong { color: #fff; display: block; font-size: 1.02rem; margin-bottom: 2px; }
    .ban-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase;
      background: rgba(255,92,122,.2); color: #ff9aaf; border: 1px solid rgba(255,92,122,.35);
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px;
    }
    @media (max-width: 720px) {
      .stats-grid { grid-template-columns: 1fr; }
      .profile-actions { margin-left: 0; width: 100%; }
      .profile-actions .btn { flex: 1; }
    }
    .stat-tile {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; box-shadow: var(--shadow);
    }
    .stat-tile .label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: .06em; }
    .stat-tile .value {
      margin-top: 8px; font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 1.45rem; font-weight: 700;
    }
    .stat-tile .value.pts { color: var(--accent); }
    .stat-tile .value.pts.rank-gold { color: var(--gold); }
    .stat-tile .value.pts.rank-silver { color: #c9c8c4; }
    .stat-tile .value.pts.rank-bronze { color: #d0893d; }
    .stat-tile .value.ban { color: var(--danger); }
    .stat-tile .hint { margin-top: 4px; color: var(--muted); font-size: 0.82rem; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
      box-shadow: var(--shadow); backdrop-filter: blur(8px);
    }
    .card h2 {
      margin: 0; padding: 14px 18px; background: var(--panel2);
      border-bottom: 1px solid var(--border); font-size: 0.95rem; font-weight: 700;
    }
    .card-body { padding: 8px 6px 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; }
    tr:last-child td { border-bottom: none; }
    .pts { color: var(--accent); font-weight: 700; font-family: "JetBrains Mono", ui-monospace, monospace; }
    .pts.rank-gold { color: var(--gold); }
    .pts.rank-silver { color: #c9c8c4; }
    .pts.rank-bronze { color: #d0893d; }
    .muted { color: var(--muted); }
    .err {
      color: #ffcdd2; background: rgba(239,83,80,.12);
      border: 1px solid rgba(239,83,80,.35); padding: 14px 16px; border-radius: 14px;
    }
    .period-row {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin: 0 0 16px;
    }
    .period-row label { color: var(--muted); font-size: 0.9rem; font-weight: 600; }
    .period-row select {
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px; font-size: 0.9rem; font-family: inherit;
    }
    .srv-link { color: var(--text); text-decoration: none; font-weight: 600; }
    .srv-link:hover { color: var(--accent); text-decoration: none; }
    .pill-ok { color: var(--ok); font-weight: 600; }
    .pill-no { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="../" class="back">← Глобальный рейтинг</a>
    <div id="head"><div class="hero"><h1 style="margin:0;font-size:1.4rem">Профиль</h1></div></div>
    <div class="period-row">
      <label for="profilePeriod">Период</label>
      <select id="profilePeriod">
        <option value="alltime" selected>Всё время</option>
        <option value="year">Год</option>
        <option value="today">Сегодня</option>
        <option value="yesterday">Вчера</option>
      </select>
    </div>
    <p class="muted" id="subNote">Данные обновляются каждые 5 минут.</p>
    <div id="content"><p class="muted">Загрузка…</p></div>
  </div>

  <script src="../config.js"></script>
  <script src="../skins.js?v=3"></script>
  <script src="../statsbg.js?v=1"></script>
  <script>
    const API = window.STATS_API || "https://agar.su/stats-api";
    const REFRESH_MS = window.STATS_REFRESH_MS || 300000;
    const { loadSkins, resolveAvatar, avatarHtml, setFavicon } = window.statsSkins;
    const serverUrl = window.statsServerUrl;

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function serverCell(sid, name) {
      const label = esc(name || sid);
      if (!sid || !serverUrl) return label;
      return `<a href="${esc(serverUrl(sid))}" class="srv-link">${label}</a>`;
    }

    function currentProfileLink(id) {
      return window.statsProfileUrl(id);
    }

    async function copyLink(id) {
      const url = currentProfileLink(id);
      try {
        await navigator.clipboard.writeText(url);
        const btn = document.getElementById("copyBtn");
        if (btn) {
          btn.textContent = "Скопировано!";
          btn.classList.add("ok");
          setTimeout(() => { btn.textContent = "Копировать ссылку"; btn.classList.remove("ok"); }, 2000);
        }
      } catch {
        prompt("Скопируйте ссылку:", url);
      }
    }

    function nickRankClass(stats) {
      const r = Number(stats && stats.globalRank);
      if (r < 1 || r > 3) return "";
      if (r === 1) return "rank-gold";
      if (r === 2) return "rank-silver";
      if (r === 3) return "rank-bronze";
      return "";
    }

    function vaasTrophyHtml(nick) {
      if (String(nick || "").trim().toLowerCase() !== "vaas") return "";
      return `<a href="https://agar.su/tournament/#1" class="profile-trophy" target="_blank" rel="noopener" title="Победитель турнира">` +
        `<img src="https://agar.su/assets/photo/trophy.png" alt="Победитель турнира"></a>`;
    }

    function setPageMeta(stats, nick, avatarUrl) {
      const rank = stats.globalRank;
      const banPart = stats.banned ? "BAN · " : "";
      const rankPart = rank ? "#" + rank + " " : "";
      document.title = banPart + rankPart + nick + " — Profile · Agar.su";
      const iconUrl = avatarUrl || window.DEFAULT_SKIN_URL || "https://agar.su/skins/4.png";
      setFavicon(iconUrl);
    }

    function formatGlobalRank(stats) {
      if (stats.banned) return '<span class="pts ban">—</span>';
      if (!stats.globalRank) return '<span class="muted">—</span>';
      const boardLabel = stats.rankBoard === "clans" ? "кланов" : "игроков";
      const total = stats.globalRankTotal ? ` <span class="muted">из ${stats.globalRankTotal} ${boardLabel}</span>` : "";
      const rankCls = nickRankClass(stats);
      return `<span class="pts ${rankCls}">${stats.globalRank}</span>${total}`;
    }

    const PERIOD_LABELS = {
      today: "Сегодня",
      yesterday: "Вчера",
      year: "Год",
      alltime: "Всё время",
    };

    function render(stats) {
      const id = stats.id || stats.uid;
      const nick = stats.nick || (stats.nicks && stats.nicks[0]) || "—";
      const ava = resolveAvatar(stats) || resolveAvatar({ nick });
      setPageMeta(stats, nick, ava);
      const period = stats.period || "alltime";
      const banned = !!stats.banned;
      const rankCls = nickRankClass(stats);
      const maxPts = Number(stats.maxPoints) || 150;
      const points = banned ? -1 : (Number(stats.points) || 0);

      const head = document.getElementById("head");
      head.innerHTML = `
        <div class="hero">
          <div class="profile-head">
            ${avatarHtml(ava)}
            <div>
              <div class="profile-nick-row">
                <div class="profile-nick ${banned ? "" : rankCls}">${esc(nick)}</div>
                ${vaasTrophyHtml(nick)}
                ${banned ? '<span class="ban-badge">BAN</span>' : ""}
              </div>
              <div class="profile-meta">ID ${esc(id)} · ${esc(PERIOD_LABELS[period] || period)}</div>
            </div>
            <div class="profile-actions">
              <button class="btn" id="copyBtn" type="button">Копировать ссылку</button>
            </div>
          </div>
          ${banned ? `
            <div class="ban-banner">
              <div>
                <strong>${esc(stats.banMessage || "Данный игрок в бане")}</strong>
                <div>Ник заблокирован в статистике. Очки зафиксированы как −1.</div>
              </div>
            </div>` : ""}
        </div>`;
      document.getElementById("copyBtn").onclick = () => copyLink(id);

      let html = `<div class="stats-grid">
        <div class="stat-tile">
          <div class="label">Место</div>
          <div class="value pts ${banned ? "ban" : rankCls}">${banned ? "—" : (stats.globalRank || "—")}</div>
          <div class="hint">${esc(PERIOD_LABELS[period] || period)}</div>
        </div>
        <div class="stat-tile">
          <div class="label">Очки</div>
          <div class="value pts ${banned ? "ban" : ""}">${points}</div>
          <div class="hint">${banned ? "бан в статистике" : "из " + maxPts + " за опрос"}</div>
        </div>
        <div class="stat-tile">
          <div class="label">Лучший рекорд</div>
          <div class="value">${banned ? "—" : (Number(stats.bestScore) || 0)}</div>
          <div class="hint">за выбранный период</div>
        </div>
      </div>`;

      if (banned) {
        html += `<div class="card"><h2>Статус</h2><div class="card-body" style="padding:16px 18px">
          <p style="margin:0">Данный ник в бане. Профиль сохранён, но очки и рейтинг отключены.</p>
        </div></div>`;
        return html;
      }

      if (stats.lastPoll && stats.lastPoll.servers) {
        const rows = Object.entries(stats.lastPoll.servers);
        if (rows.length) {
          html += `<div class="card"><h2>Последнее обновление</h2><div class="card-body"><table>
            <thead><tr><th>Сервер</th><th>Место</th><th>Рекорд</th><th>Очки</th></tr></thead><tbody>`;
          rows.forEach(([sid, r]) => {
            html += `<tr><td>${serverCell(sid, r.serverName || sid)}</td><td>${r.rank || "—"}</td>
              <td class="pts">${r.score || 0}</td><td>${r.points || 0}</td></tr>`;
          });
          html += "</tbody></table></div></div>";
        }
      }

      const recList = Object.values(stats.records || {});
      html += `<div class="card"><h2>Рекорды по серверам · ${esc(PERIOD_LABELS[period] || period)}</h2><div class="card-body">`;
      if (!recList.length) {
        html += '<p class="muted" style="padding:12px 14px">Нет данных по серверам за этот период.</p>';
      } else {
        html += '<table><thead><tr><th>Сервер</th><th>Тип</th><th>Рекорд</th><th>Ник</th><th>Место</th><th>Статус</th></tr></thead><tbody>';
        recList.forEach((r) => {
          const label = r.scoreLabel || (r.kind === "score" ? "Побед" : "Масса");
          const has = r.hasRecord === true || (Number(r.score) || 0) > 0;
          html += `<tr>
            <td>${serverCell(r.serverId, r.serverName || r.serverId)}</td>
            <td class="muted">${esc(label)}</td>
            <td class="pts">${has ? (r.score || 0) : "—"}</td>
            <td>${has ? esc(r.nick || "—") : '<span class="muted">—</span>'}</td>
            <td>${has && r.rank ? r.rank : "—"}</td>
            <td>${has ? '<span class="pill-ok">есть</span>' : '<span class="pill-no">нет</span>'}</td>
          </tr>`;
        });
        html += "</tbody></table>";
      }
      html += "</div></div>";
      return html;
    }

    async function load(id, forceSkins) {
      const box = document.getElementById("content");
      if (!box.dataset.loaded) box.innerHTML = '<p class="muted">Загрузка…</p>';
      const period = document.getElementById("profilePeriod")?.value || "alltime";
      history.replaceState(null, "", "?id=" + encodeURIComponent(id) + "&period=" + encodeURIComponent(period));
      try {
        await loadSkins(forceSkins);
        const res = await fetch(
          API + "/api/user/" + encodeURIComponent(id) + "?period=" + encodeURIComponent(period),
          { cache: "no-store" }
        );
        if (!res.ok) throw new Error(res.status === 404 ? "Профиль не найден" : "HTTP " + res.status);
        const data = await res.json();
        box.innerHTML = render(data);
        if (typeof applyStatsBgForNick === "function") {
          await applyStatsBgForNick(data.nick || (data.nicks && data.nicks[0]) || "");
        } else if (data.statsBgUrl && typeof applyStatsBodyBackground === "function") {
          applyStatsBodyBackground(data.statsBgUrl);
        }
        box.dataset.loaded = "1";
      } catch (e) {
        box.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
      }
    }

    const q = new URLSearchParams(location.search);
    const qId = q.get("id");
    const qPeriod = q.get("period");
    if (qPeriod && document.getElementById("profilePeriod")) {
      document.getElementById("profilePeriod").value = qPeriod;
    }
    document.getElementById("profilePeriod")?.addEventListener("change", () => {
      if (qId) load(qId, false);
    });
    if (qId) {
      load(qId, true);
      setInterval(() => load(qId, false), REFRESH_MS);
    } else {
      document.getElementById("content").innerHTML = '<div class="err">Укажите id: users/?id=8</div>';
    }
  </script>
</body>
</html>
