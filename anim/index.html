<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agar.su - Sprite animated</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .app {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
            margin: 10px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e8ecf0;
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header h1 .accent-blue { color: #1a73e8; }
        .header h1 .accent-red { color: #ea4335; }
        .header h1 .accent-green { color: #34a853; }
        .header h1 .accent-yellow { color: #fbbc04; }

        .header .subtitle {
            color: #5f6368;
            font-size: 0.8rem;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            background: #f8f9fa;
            border-radius: 14px;
            padding: 8px 16px;
            margin-bottom: 16px;
            border: 1px solid #e8ecf0;
        }

        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: #5f6368;
        }

        .stats-bar .stat i { color: #1a73e8; width: 16px; }
        .stats-bar .stat strong { color: #1a1a2e; font-weight: 700; }
        .stats-bar .stat .highlight-red { color: #ea4335; }
        .stats-bar .stat .highlight-green { color: #34a853; }
        .stats-bar .stat .highlight-blue { color: #1a73e8; }

        .circle-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 12px 0;
            min-height: 80px;
        }

        .circle-item {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #e8ecf0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: grab;
            background: #f8f9fa;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            touch-action: none;
            user-select: none;
        }

        .circle-item:active { cursor: grabbing; }
        .circle-item.dragging { opacity: 0.4; transform: scale(0.85); border-color: #1a73e8; }
        .circle-item.drag-over { border-color: #1a73e8; border-width: 4px; transform: scale(1.05); }

        .circle-item:hover {
            transform: scale(1.06);
            border-color: #1a73e8;
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.15);
        }

        .circle-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .circle-item .index-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            text-align: center;
            padding: 1px 0;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .circle-item .remove-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.95);
            background: rgba(234, 67, 53, 0.95);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(234, 67, 53, 0.5);
            pointer-events: none;
        }

        .circle-item:hover .remove-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .circle-item .remove-btn:hover {
            background: #d33426;
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 6px 28px rgba(234, 67, 53, 0.7);
        }

        .circle-item .remove-btn i { font-size: 12px; }

        /* ✏️ КНОПКА ЗАМЕНЫ ФОТО */
        .circle-item .edit-btn {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.95);
            background: rgba(26, 115, 232, 0.95);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(26, 115, 232, 0.5);
            pointer-events: none;
        }

        .circle-item:hover .edit-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .circle-item .edit-btn:hover {
            background: #1557b0;
            transform: translate(-50%, 50%) scale(1.15);
            box-shadow: 0 6px 28px rgba(26, 115, 232, 0.7);
        }

        .circle-item .edit-btn i { font-size: 12px; }

        .circle-add {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3px dashed #d0d4d9;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            font-size: 1.8rem;
            color: #9aa0a6;
        }

        .circle-add:hover {
            border-color: #1a73e8;
            background: #e8f0fe;
            transform: scale(1.08);
            color: #1a73e8;
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.12);
        }

        .circle-add.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            border-color: #e8ecf0;
            color: #d0d4d9;
        }

        .circle-add-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #fileInput, #editFileInput {
            display: none;
        }

        /* ===== PREVIEW ===== */
        .preview-section {
            margin-top: 20px;
            background: #f8f9fa;
            border-radius: 18px;
            padding: 18px;
            border: 1px solid #e8ecf0;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .preview-header h3 {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-header h3 i { color: #1a73e8; }

        .preview-header .info {
            font-size: 0.75rem;
            color: #5f6368;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bg-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .bg-controls label {
            font-size: 0.7rem;
            color: #5f6368;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bg-controls input[type="color"] {
            width: 28px;
            height: 28px;
            border: 2px solid #e8ecf0;
            border-radius: 8px;
            padding: 2px;
            cursor: pointer;
            background: #fff;
        }

        .bg-controls .bg-preset {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 2px solid #e8ecf0;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .bg-controls .bg-preset:hover {
            transform: scale(1.1);
            border-color: #1a73e8;
        }

        .bg-controls .bg-preset.active {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2);
        }

        .bg-controls .bg-preset-transparent {
            background: repeating-conic-gradient(#e8ecf0 0% 25%, #ffffff 0% 50%) 0 0 / 12px 12px;
        }

        .preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
            max-height: 560px;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
            max-width: 560px;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
            background: repeating-conic-gradient(#e8ecf0 0% 25%, #ffffff 0% 50%) 0 0 / 20px 20px;
            border: 2px solid #e8ecf0;
        }

        .preview-circle {
            width: 92%;
            height: 92%;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
            background: inherit;
        }

        .preview-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.15s ease;
        }

        .preview-overlay {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            white-space: nowrap;
            z-index: 5;
        }

        .preview-overlay .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34a853;
            display: inline-block;
            animation: livePulse 1s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.6); }
        }

        .preview-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.4;
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            color: #5f6368;
            z-index: 1;
        }

        .preview-placeholder i {
            font-size: 2.2rem;
            color: #1a73e8;
            opacity: 0.5;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            flex: 1;
            justify-content: center;
            min-width: 90px;
        }

        .btn:active { transform: scale(0.95); }

        .btn-success {
            background: #34a853;
        }
        .btn-success:hover {
            background: #2d9248;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52, 168, 83, 0.3);
        }

        .btn-secondary {
            background: #e8ecf0;
            color: #1a1a2e;
        }
        .btn-secondary:hover {
            background: #d5d9de;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ea4335;
        }
        .btn-danger:hover {
            background: #d33426;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(234, 67, 53, 0.3);
        }

        .btn-primary {
            background: #1a73e8;
        }
        .btn-primary:hover {
            background: #1557b0;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.3);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e8f0fe;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #1a73e8;
            border: 1px solid #d2e3fc;
        }

        .example-hint {
            text-align: center;
            opacity: 0.4;
            font-size: 0.65rem;
            margin-top: 14px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            color: #5f6368;
        }

        .example-hint i { color: #1a73e8; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .circle-item { animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @media (max-width: 768px) {
            .app { padding: 14px; border-radius: 20px; }
            .header h1 { font-size: 1.2rem; }
            .circle-item, .circle-add { width: 64px; height: 64px; }
            .circle-item .remove-btn, .circle-item .edit-btn { width: 28px; height: 28px; font-size: 11px; }
            .circle-grid { gap: 10px; padding: 10px 0; }
            .stats-bar { gap: 10px; padding: 6px 12px; font-size: 0.7rem; flex-wrap: wrap; }
            .btn { min-width: 70px; padding: 7px 12px; font-size: 0.75rem; }
            .preview-container { min-height: 280px; max-height: 380px; }
            .preview-overlay { font-size: 0.55rem; padding: 3px 10px; bottom: 10px; }
            .bg-controls input[type="color"] { width: 24px; height: 24px; }
            .bg-controls .bg-preset { width: 24px; height: 24px; }
        }

        @media (max-width: 480px) {
            .app { padding: 10px; border-radius: 16px; }
            .header h1 { font-size: 1rem; }
            .circle-item, .circle-add { width: 56px; height: 56px; }
            .circle-item .remove-btn, .circle-item .edit-btn { width: 24px; height: 24px; font-size: 9px; }
            .circle-item .index-badge { font-size: 7px; }
            .circle-grid { gap: 8px; padding: 8px 0; }
            .preview-container { min-height: 220px; max-height: 280px; }
            .stats-bar { gap: 6px; padding: 4px 10px; font-size: 0.65rem; }
            .stats-bar .stat i { width: 12px; }
            .btn { min-width: 55px; padding: 5px 10px; font-size: 0.68rem; }
            .preview-overlay { font-size: 0.5rem; padding: 2px 8px; bottom: 8px; }
            .example-hint { font-size: 0.55rem; gap: 8px; }
            .bg-controls input[type="color"] { width: 20px; height: 20px; }
            .bg-controls .bg-preset { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

    <div class="app">

        <div class="stats-bar">
            <span class="stat"><i class="fas fa-images"></i> Кадры: <strong id="frameCount" class="highlight-blue">0</strong></span>
            <span class="stat"><i class="fas fa-arrows-alt-h"></i> Ширина: <strong id="widthDisplay">—</strong></span>
            <span class="stat"><i class="fas fa-weight-hanging"></i> Вес: <strong id="fileSize">—</strong></span>
            <span class="stat"><i class="fas fa-flag"></i> Высота: <strong class="highlight-green">400px</strong></span>
            <span class="stat"><i class="fas fa-play"></i> FPS: <strong class="highlight-red">~10</strong></span>
        </div>

        <div class="circle-grid" id="circleGrid"></div>

        <div class="preview-section">
            <div class="preview-header">
                <h3><i class="fas fa-eye"></i> Предпросмотр</h3>
                <div class="info">
                    <div class="bg-controls">
                        <label><i class="fas fa-fill-drip"></i> Фон:</label>
                        <div class="bg-preset bg-preset-transparent active" data-bg="transparent" title="Прозрачный"></div>
                        <div class="bg-preset" style="background:#1a1a2e;" data-bg="#1a1a2e" title="Тёмный"></div>
                        <div class="bg-preset" style="background:#ffffff;" data-bg="#ffffff" title="Белый"></div>
                        <div class="bg-preset" style="background:#1a73e8;" data-bg="#1a73e8" title="Синий"></div>
                        <div class="bg-preset" style="background:#ea4335;" data-bg="#ea4335" title="Красный"></div>
                        <div class="bg-preset" style="background:#34a853;" data-bg="#34a853" title="Зелёный"></div>
                        <input type="color" id="customBgColor" value="#1a1a2e" title="Свой цвет" />
                    </div>
                    <span id="previewInfo">
                        <i class="fas fa-plus-circle" style="color:#1a73e8;"></i> 2–10 кадров
                    </span>
                </div>
            </div>
            <div class="preview-container">
                <div class="preview-frame" id="previewFrame">
                    <div class="preview-circle" id="previewCircle">
                        <img id="previewImage" src="" alt="Превью" />
                    </div>
                    <div class="preview-placeholder" id="placeholder">
                        <i class="fas fa-images"></i>
                        <span>Нажмите на круг <i class="fas fa-plus-circle"></i></span>
                    </div>
                    <div class="preview-overlay" id="previewOverlay" style="display:none;">
                        <span class="live-dot"></span>
                        <span id="frameIndicator">1 / 1</span>
                    </div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" id="exportBtn" disabled>
                    <i class="fas fa-download"></i> Скачать
                </button>
                <button class="btn btn-secondary" id="copyBtn" disabled>
                    <i class="fas fa-copy"></i> Копировать
                </button>
                <button class="btn btn-danger" id="clearAllBtn">
                    <i class="fas fa-trash-alt"></i> Очистить
                </button>
                <button class="btn btn-primary" id="toggleAnimBtn">
                    <i class="fas fa-pause"></i> Пауза
                </button>
            </div>
        </div>

        <div class="example-hint">
            <span><i class="fas fa-circle blue"></i> + <i class="fas fa-circle red"></i> + <i class="fas fa-circle green"></i> = <i class="fas fa-arrow-right"></i> <i class="fas fa-images"></i> Спрайт</span>
            <span><i class="fas fa-arrows-alt"></i> Перетащите кадры</span>
            <span><i class="fas fa-pen"></i> Наведите для замены</span>
            <span><i class="fas fa-palette"></i> Фон под скином</span>
        </div>
    </div>

    <input type="file" id="fileInput" multiple accept="image/*" />
    <input type="file" id="editFileInput" accept="image/*" />

    <script>
        (function() {
            'use strict';

            const grid = document.getElementById('circleGrid');
            const previewImage = document.getElementById('previewImage');
            const previewFrame = document.getElementById('previewFrame');
            const previewCircle = document.getElementById('previewCircle');
            const placeholder = document.getElementById('placeholder');
            const previewOverlay = document.getElementById('previewOverlay');
            const frameIndicator = document.getElementById('frameIndicator');
            const frameCountEl = document.getElementById('frameCount');
            const widthDisplay = document.getElementById('widthDisplay');
            const fileSizeEl = document.getElementById('fileSize');
            const previewInfo = document.getElementById('previewInfo');
            const exportBtn = document.getElementById('exportBtn');
            const copyBtn = document.getElementById('copyBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const toggleAnimBtn = document.getElementById('toggleAnimBtn');
            const fileInput = document.getElementById('fileInput');
            const editFileInput = document.getElementById('editFileInput');
            const customBgColor = document.getElementById('customBgColor');

            const MAX_FRAMES = 10;
            const MIN_FRAMES = 2;
            const FRAME_HEIGHT = 400;

            let frames = [];
            let animTimer = null;
            let animPaused = false;
            let currentFrameIndex = 0;
            let editIndex = -1;
            let dragIndex = null;

            // --- BACKGROUND ---
            let currentBg = 'transparent';

            function setBackground(bg) {
                currentBg = bg;
                if (bg === 'transparent') {
                    const pattern = 'repeating-conic-gradient(#e8ecf0 0% 25%, #ffffff 0% 50%) 0 0 / 20px 20px';
                    previewFrame.style.background = pattern;
                    previewCircle.style.background = pattern;
                } else {
                    previewFrame.style.background = bg;
                    previewCircle.style.background = bg;
                }
                document.querySelectorAll('.bg-preset').forEach(el => {
                    el.classList.toggle('active', el.dataset.bg === bg);
                });
                if (bg !== 'transparent') {
                    document.querySelector('.bg-preset-transparent')?.classList.remove('active');
                }
            }

            // --- RENDER CIRCLES ---
            function renderCircles() {
                grid.innerHTML = '';

                frames.forEach((frame, index) => {
                    const div = document.createElement('div');
                    div.className = 'circle-item';
                    div.draggable = true;
                    div.dataset.index = index;

                    const img = document.createElement('img');
                    img.src = frame.dataUrl;
                    img.alt = `Кадр ${index + 1}`;
                    img.title = `Кадр ${index + 1}`;
                    div.appendChild(img);

                    const badge = document.createElement('span');
                    badge.className = 'index-badge';
                    badge.textContent = `#${index + 1}`;
                    div.appendChild(badge);

                    // 🔥 КРЕСТИК УДАЛЕНИЯ
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-btn';
                    removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    removeBtn.title = 'Удалить кадр';
                    removeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        removeFrame(index);
                    });
                    div.appendChild(removeBtn);

                    // ✏️ КНОПКА ЗАМЕНЫ
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-btn';
                    editBtn.innerHTML = '<i class="fas fa-pen"></i>';
                    editBtn.title = 'Заменить фото';
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        editIndex = index;
                        editFileInput.click();
                    });
                    div.appendChild(editBtn);

                    // 🔥 DRAG & DROP — ПРАВИЛЬНЫЕ СОБЫТИЯ
                    div.addEventListener('dragstart', (e) => {
                        dragIndex = index;
                        div.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', String(index));
                    });

                    div.addEventListener('dragend', () => {
                        div.classList.remove('dragging');
                        document.querySelectorAll('.circle-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                        dragIndex = null;
                    });

                    div.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (dragIndex === null || dragIndex === index) return;
                        document.querySelectorAll('.circle-item.drag-over').forEach(el => el.classList.remove('drag-over'));
                        div.classList.add('drag-over');
                    });

                    div.addEventListener('dragleave', () => {
                        div.classList.remove('drag-over');
                    });

                    div.addEventListener('drop', (e) => {
                        e.preventDefault();
                        div.classList.remove('drag-over');
                        const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                        if (!isNaN(fromIndex) && fromIndex !== index) {
                            reorderFrames(fromIndex, index);
                        }
                        dragIndex = null;
                    });

                    grid.appendChild(div);
                });

                // Кнопка добавления
                const wrapper = document.createElement('div');
                wrapper.className = 'circle-add-wrapper';

                const addBtn = document.createElement('div');
                addBtn.className = 'circle-add' + (frames.length >= MAX_FRAMES ? ' disabled' : '');
                addBtn.innerHTML = `<i class="fas fa-plus"></i>`;
                addBtn.title = frames.length >= MAX_FRAMES ? 'Достигнут максимум (10)' : 'Добавить кадр';

                if (frames.length < MAX_FRAMES) {
                    addBtn.addEventListener('click', () => fileInput.click());
                }

                wrapper.appendChild(addBtn);
                grid.appendChild(wrapper);

                updateStats();
                updateButtons();
                startAnimation();
            }

            function reorderFrames(from, to) {
                if (from === to) return;
                const [item] = frames.splice(from, 1);
                frames.splice(to, 0, item);
                renderCircles();
            }

            function removeFrame(index) {
                if (frames.length <= MIN_FRAMES) {
                    alert(`⚠️ Минимум ${MIN_FRAMES} кадра для склейки.`);
                    return;
                }
                frames.splice(index, 1);
                renderCircles();
            }

            function replaceFrame(index, dataUrl, img) {
                frames[index] = { ...frames[index], dataUrl, img };
                renderCircles();
            }

            function clearAll() {
                if (frames.length === 0) return;
                if (!confirm('🗑️ Удалить все кадры?')) return;
                frames = [];
                stopAnimation();
                renderCircles();
                previewImage.style.display = 'none';
                placeholder.style.display = 'flex';
                previewOverlay.style.display = 'none';
            }

            function updateStats() {
                const count = frames.length;
                frameCountEl.textContent = count;

                if (count < MIN_FRAMES) {
                    widthDisplay.textContent = '—';
                    fileSizeEl.textContent = '—';
                    previewInfo.innerHTML = '<i class="fas fa-plus-circle" style="color:#1a73e8;"></i> Добавьте 2–10 кадров';
                    return;
                }

                const totalWidth = count * FRAME_HEIGHT;
                widthDisplay.textContent = `${totalWidth}px`;

                const totalPixels = totalWidth * FRAME_HEIGHT;
                const estimatedBytes = Math.round(totalPixels * 4 * 0.55);
                if (estimatedBytes > 1024 * 1024) {
                    fileSizeEl.textContent = (estimatedBytes / 1024 / 1024).toFixed(1) + ' MB';
                } else if (estimatedBytes > 1024) {
                    fileSizeEl.textContent = (estimatedBytes / 1024).toFixed(0) + ' KB';
                } else {
                    fileSizeEl.textContent = estimatedBytes + ' B';
                }

                previewInfo.innerHTML = `
                    <i class="fas fa-images" style="color:#1a73e8;"></i> ${count} кадров · 
                    <i class="fas fa-arrows-alt-h" style="color:#34a853;"></i> ${totalWidth}×${FRAME_HEIGHT}
                `;
            }

            function updateButtons() {
                const hasFrames = frames.length >= MIN_FRAMES && frames.length <= MAX_FRAMES;
                exportBtn.disabled = !hasFrames;
                copyBtn.disabled = !hasFrames;
            }

            // --- ANIMATION ---
            function startAnimation() {
                stopAnimation();

                const count = frames.length;
                if (count < MIN_FRAMES || count > MAX_FRAMES) {
                    previewImage.style.display = 'none';
                    placeholder.style.display = 'flex';
                    previewOverlay.style.display = 'none';
                    return;
                }

                previewImage.style.display = 'block';
                placeholder.style.display = 'none';
                previewOverlay.style.display = 'flex';

                currentFrameIndex = 0;

                function animateFrame() {
                    if (animPaused) {
                        animTimer = setTimeout(animateFrame, 100);
                        return;
                    }

                    const frame = frames[currentFrameIndex];
                    if (frame) {
                        previewImage.src = frame.dataUrl;
                        frameIndicator.textContent = `${currentFrameIndex + 1} / ${count}`;
                    }

                    currentFrameIndex = (currentFrameIndex + 1) % count;
                    animTimer = setTimeout(animateFrame, 100);
                }

                animateFrame();
            }

            function stopAnimation() {
                if (animTimer) {
                    clearTimeout(animTimer);
                    animTimer = null;
                }
            }

            function toggleAnimation() {
                animPaused = !animPaused;
                toggleAnimBtn.innerHTML = animPaused ?
                    '<i class="fas fa-play"></i> Пуск' :
                    '<i class="fas fa-pause"></i> Пауза';
            }

            // --- EXPORT ---
            function renderFullSprite() {
                const count = frames.length;
                if (count < MIN_FRAMES || count > MAX_FRAMES) return null;

                const size = FRAME_HEIGHT;
                const totalWidth = count * size;
                const totalHeight = size;

                const canvas = document.createElement('canvas');
                canvas.width = totalWidth;
                canvas.height = totalHeight;
                const ctx = canvas.getContext('2d');

                ctx.clearRect(0, 0, totalWidth, totalHeight);

                frames.forEach((frame, index) => {
                    const img = frame.img;
                    const x = index * size;
                    const centerX = x + size / 2;
                    const centerY = size / 2;
                    const radius = size / 2;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();

                    if (img && img.complete && img.naturalWidth > 0) {
                        const scale = Math.max(size / img.naturalWidth, size / img.naturalHeight);
                        const drawWidth = img.naturalWidth * scale;
                        const drawHeight = img.naturalHeight * scale;
                        const dx = centerX - drawWidth / 2;
                        const dy = centerY - drawHeight / 2;
                        ctx.drawImage(img, dx, dy, drawWidth, drawHeight);
                    }

                    ctx.restore();
                });

                return canvas;
            }

            function downloadSpriteSheet() {
                const canvas = renderFullSprite();
                if (!canvas) return;

                canvas.toBlob((blob) => {
                    if (blob) {
                        const link = document.createElement('a');
                        link.download = `sprite_${frames.length}frames_400px.png`;
                        link.href = URL.createObjectURL(blob);
                        link.click();
                        setTimeout(() => URL.revokeObjectURL(link.href), 5000);
                    }
                }, 'image/png');
            }

            async function copyToClipboard() {
                const canvas = renderFullSprite();
                if (!canvas) return;

                try {
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    await navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob })
                    ]);
                    alert('✅ Изображение скопировано в буфер!');
                } catch (e) {
                    alert('❌ Не удалось скопировать: ' + e.message);
                }
            }

            // --- ADD / EDIT ---
            function addFiles(fileList) {
                const files = Array.from(fileList);
                const validFiles = files.filter(f => f.type.startsWith('image/'));

                if (validFiles.length === 0) {
                    alert('⚠️ Пожалуйста, выберите изображения.');
                    return;
                }

                const total = frames.length + validFiles.length;
                if (total > MAX_FRAMES) {
                    alert(`⚠️ Максимум ${MAX_FRAMES} кадров. Сейчас ${frames.length}, вы добавили ${validFiles.length}.`);
                    return;
                }

                const loadPromises = validFiles.map((file) => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const dataUrl = e.target.result;
                            const img = new Image();
                            img.onload = () => {
                                frames.push({ img, dataUrl, file });
                                resolve();
                            };
                            img.onerror = () => {
                                const fallbackImg = new Image();
                                fallbackImg.src = dataUrl;
                                frames.push({ img: fallbackImg, dataUrl, file });
                                resolve();
                            };
                            img.src = dataUrl;
                        };
                        reader.onerror = () => resolve();
                        reader.readAsDataURL(file);
                    });
                });

                Promise.all(loadPromises).then(() => {
                    renderCircles();
                });
            }

            function handleEditFile(file) {
                if (editIndex < 0 || editIndex >= frames.length) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    const img = new Image();
                    img.onload = () => {
                        replaceFrame(editIndex, dataUrl, img);
                        editIndex = -1;
                    };
                    img.onerror = () => {
                        const fallbackImg = new Image();
                        fallbackImg.src = dataUrl;
                        replaceFrame(editIndex, dataUrl, fallbackImg);
                        editIndex = -1;
                    };
                    img.src = dataUrl;
                };
                reader.readAsDataURL(file);
                editFileInput.value = '';
            }

            // --- EVENTS ---
            fileInput.addEventListener('change', (e) => {
                addFiles(e.target.files);
                fileInput.value = '';
            });

            editFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleEditFile(e.target.files[0]);
                }
                editFileInput.value = '';
            });

            clearAllBtn.addEventListener('click', clearAll);
            exportBtn.addEventListener('click', downloadSpriteSheet);
            copyBtn.addEventListener('click', copyToClipboard);
            toggleAnimBtn.addEventListener('click', toggleAnimation);

            // Background presets
            document.querySelectorAll('.bg-preset').forEach(el => {
                el.addEventListener('click', () => {
                    setBackground(el.dataset.bg);
                });
            });

            customBgColor.addEventListener('input', (e) => {
                setBackground(e.target.value);
                document.querySelectorAll('.bg-preset').forEach(el => el.classList.remove('active'));
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
                    e.preventDefault();
                    downloadSpriteSheet();
                }
                if (e.key === ' ') {
                    e.preventDefault();
                    toggleAnimation();
                }
            });

            // Global drop
            document.querySelector('.app').addEventListener('dragover', (e) => {
                e.preventDefault();
                document.querySelector('.circle-add:not(.disabled)')?.style.setProperty('border-color', '#1a73e8');
            });

            document.querySelector('.app').addEventListener('dragleave', () => {
                document.querySelector('.circle-add')?.style.removeProperty('border-color');
            });

            document.querySelector('.app').addEventListener('drop', (e) => {
                e.preventDefault();
                document.querySelector('.circle-add')?.style.removeProperty('border-color');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    addFiles(files);
                }
            });

            // --- INIT ---
            renderCircles();
            setBackground('transparent');

            console.log('🧩 PRO-редактор спрайтов!');
            console.log('🔄 Перетаскивайте кадры — работает!');
            console.log('❌ Крестик удаления — работает!');
            console.log('🎨 Фон меняется под скином');

        })();
    </script>

</body>
</html>
